<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تتبع الأصول</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; min-height: 100vh; }
  .login-card { max-width: 380px; margin: 40px auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; font-size: 15px; }
  input { border: 1px solid #ddd; }
  button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: bold; }
  .error { color: #dc2626; text-align: center; margin: 10px 0; }
</style>
</head>
<body>

<div class="login-card">
  <h1 style="text-align:center;margin-bottom:20px;">📦 نظام تتبع الأصول</h1>
  <input type="text" id="username" placeholder="اسم المستخدم" value="admin" />
  <input type="password" id="password" placeholder="كلمة المرور" value="admin" />
  <button onclick="doLogin()">دخول</button>
  <div class="error" id="errorMsg"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxe6wbuqxp_5XbipgBdxYlR8c-NoRgUV7h15Ld7WRwjYgHZA7Ed_gyfckdu4XMRAmMT/exec";

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.textContent = '';

  if (!username || !password) {
    errorMsg.textContent = "يرجى إدخال اسم المستخدم وكلمة المرور";
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', username, password })
    });

    const result = await response.json();

    if (result.success) {
      alert("✅ تم تسجيل الدخول بنجاح!\n\n" + result.user.fullName);
      console.log("User:", result.user);
      // هنا هننتقل للصفحة الرئيسية لاحقاً
    } else {
      errorMsg.textContent = result.message || "بيانات دخول غير صحيحة";
    }
  } catch (err) {
    console.error(err);
    errorMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
  }
}
</script>
</body>
</html>
